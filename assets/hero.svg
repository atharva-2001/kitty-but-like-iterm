<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5bde6"/>
      <stop offset="0.5" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1e2e" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect x="60" y="56" width="840" height="350" rx="12"/></clipPath>
  </defs>

  <rect width="960" height="460" rx="20" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <rect x="60" y="56" width="840" height="350" rx="12" fill="#181926"/>
  </g>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="60" y="56" width="840" height="34" fill="#11111b"/>
    <circle cx="82" cy="73" r="6" fill="#ff5f57"/>
    <circle cx="102" cy="73" r="6" fill="#febc2e"/>
    <circle cx="122" cy="73" r="6" fill="#28c840"/>
    <!-- powerline tabs, each tinted by its window theme -->
    <path d="M150 62 h150 l12 22 h-174 z" fill="#c6a0f6"/>
    <text x="164" y="79" font-size="12" fill="#24273a" font-weight="700">1 ~/api</text>
    <path d="M306 62 h150 l12 22 h-174 z" fill="#2a273f"/>
    <text x="322" y="79" font-size="12" fill="#ea9a97">2 ~/web</text>
    <path d="M462 62 h150 l12 22 h-174 z" fill="#16161d"/>
    <text x="478" y="79" font-size="12" fill="#c8c093">3 ~/notes</text>

    <!-- left split: Catppuccin Macchiato -->
    <rect x="60" y="90" width="418" height="316" fill="#24273a"/>
    <text x="80" y="124" font-size="14" fill="#cad3f5"><tspan fill="#a6da95">➜</tspan> <tspan fill="#8bd5ca">api</tspan> git:(<tspan fill="#ed8796">main</tspan>) make dev</text>
    <text x="80" y="150" font-size="14" fill="#a5adcb">  ready on :8080</text>
    <text x="80" y="176" font-size="14" fill="#a5adcb">  <tspan fill="#a6da95">GET</tspan> /health 200 2ms</text>
    <text x="80" y="202" font-size="14" fill="#a5adcb">  <tspan fill="#eed49f">POST</tspan> /jobs 201 14ms</text>
    <text x="80" y="228" font-size="14" fill="#cad3f5"><tspan fill="#a6da95">➜</tspan> <tspan fill="#8bd5ca">api</tspan> <tspan fill="#c6a0f6">█</tspan></text>
    <text x="80" y="380" font-size="11" fill="#6e738d">catppuccin-macchiato</text>

    <!-- divider -->
    <rect x="478" y="90" width="2" height="316" fill="#11111b"/>

    <!-- right top: Rose Pine Moon -->
    <rect x="480" y="90" width="420" height="157" fill="#232136"/>
    <text x="500" y="122" font-size="14" fill="#e0def4"><tspan fill="#9ccfd8">➜</tspan> <tspan fill="#c4a7e7">web</tspan> npm test</text>
    <text x="500" y="148" font-size="14" fill="#908caa">  <tspan fill="#9ccfd8">✓</tspan> 42 passed</text>
    <text x="500" y="174" font-size="14" fill="#e0def4"><tspan fill="#9ccfd8">➜</tspan> <tspan fill="#c4a7e7">web</tspan> <tspan fill="#ea9a97">█</tspan></text>
    <text x="500" y="234" font-size="11" fill="#6e6a86">rose-pine-moon</text>

    <!-- divider -->
    <rect x="480" y="247" width="420" height="2" fill="#11111b"/>

    <!-- right bottom: Kanagawa -->
    <rect x="480" y="249" width="420" height="157" fill="#1f1f28"/>
    <text x="500" y="282" font-size="14" fill="#dcd7ba"><tspan fill="#98bb6c">➜</tspan> <tspan fill="#7e9cd8">notes</tspan> tail -f todo.md</text>
    <text x="500" y="308" font-size="14" fill="#727169">  - [x] ship kitty config</text>
    <text x="500" y="334" font-size="14" fill="#727169">  - [ ] touch grass</text>
    <text x="500" y="380" font-size="11" fill="#54546d">kanagawa</text>
  </g>

  <!-- key hints -->
  <g font-size="13" font-weight="700" fill="#1e1e2e">
    <rect x="236" y="420" width="76" height="26" rx="6" fill="#ffffff" fill-opacity="0.75"/>
    <text x="250" y="438">⌘ D</text>
    <text x="320" y="438" font-weight="400">split</text>
    <rect x="380" y="420" width="76" height="26" rx="6" fill="#ffffff" fill-opacity="0.75"/>
    <text x="394" y="438">⌘ T</text>
    <text x="464" y="438" font-weight="400">tab</text>
    <rect x="510" y="420" width="96" height="26" rx="6" fill="#ffffff" fill-opacity="0.75"/>
    <text x="522" y="438">⌘ ⌥ ←→</text>
    <text x="614" y="438" font-weight="400">move</text>
  </g>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#1e1e2e">kitty, but like iTerm</text>
</svg>
