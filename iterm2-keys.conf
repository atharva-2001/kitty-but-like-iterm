# iTerm2-style keybindings for kitty
#
# IMPORTANT: kitty does NOT strip trailing comments from `map` lines —
# everything after the action is treated as part of the command. So all
# annotations live on their own lines above each binding. The format is:
#
#   # was: <kitty default for this key, or "unbound">
#   map <key> <action>
#
# To revert a single binding: delete the `map` line. Kitty's default
# returns (because we used `clear_all_shortcuts yes` we instead get
# nothing — comment that line out below if you'd rather layer on top
# of kitty's defaults).
#
# Terminology mapping:
#   iTerm2 "tab"    -> kitty "tab"
#   iTerm2 "split"  -> kitty "window"   (a pane inside a tab)
#   iTerm2 "window" -> kitty "os_window"

# Wipe kitty defaults so the override set is fully explicit.
clear_all_shortcuts yes

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------

# was: cmd+t = new_tab_with_cwd
map cmd+t           new_tab_with_cwd
# was: cmd+w = close_tab
map cmd+w           close_tab
# was: ctrl+shift+right = next_tab
map cmd+shift+]     next_tab
# was: ctrl+shift+left = previous_tab
map cmd+shift+[     previous_tab
# extra (iTerm2 also accepts these)
map cmd+shift+right next_tab
map cmd+shift+left  previous_tab

# was: unbound (cmd+N for tab N is iTerm2-style)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ---------------------------------------------------------------------------
# Splits / panes (kitty calls these "windows")
# ---------------------------------------------------------------------------

# was: unbound. iTerm2 cmd+d = vertical split
map cmd+d       launch --location=vsplit --cwd=current
# was: unbound. iTerm2 cmd+shift+d = horizontal split
map cmd+shift+d launch --location=hsplit --cwd=current
# was: unbound. Close current split
map cmd+shift+w close_window

# Focus between splits (iTerm2: cmd+opt+arrow)
# was: unbound
map cmd+opt+left  neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up    neighboring_window up
map cmd+opt+down  neighboring_window down

# ---------------------------------------------------------------------------
# OS windows
# ---------------------------------------------------------------------------

# was: cmd+n = new_os_window
map cmd+n       new_os_window_with_cwd
# extra: fresh window without inheriting cwd
map cmd+shift+n new_os_window

# ---------------------------------------------------------------------------
# Clipboard
# ---------------------------------------------------------------------------

# was: cmd+c = copy_to_clipboard
map cmd+c       copy_to_clipboard
# was: cmd+v = paste_from_clipboard
map cmd+v       paste_from_clipboard
# was: unbound. iTerm2 cmd+shift+v pastes the selection buffer
map cmd+shift+v paste_from_selection

# ---------------------------------------------------------------------------
# Font size
# ---------------------------------------------------------------------------

# was: cmd+plus = change_font_size +2
map cmd+plus  change_font_size all +2.0
# extra: cmd+= without shift
map cmd+equal change_font_size all +2.0
# was: cmd+minus = change_font_size -2
map cmd+minus change_font_size all -2.0
# was: cmd+0 = change_font_size 0 (reset)
map cmd+0     change_font_size all 0

# ---------------------------------------------------------------------------
# Screen / scrollback
# ---------------------------------------------------------------------------

# was: cmd+k = clear_terminal reset. This variant also clears scrollback
# and sends Ctrl+L to redraw the prompt — closer to iTerm2 cmd+k behaviour.
map cmd+k combine : clear_terminal scrollback active : send_text normal,application \x0c

# was: cmd+f = show_scrollback. iTerm2 cmd+f opens find; kitty's pager
# is where you search (press / inside it).
map cmd+f show_scrollback

# ---------------------------------------------------------------------------
# Fullscreen
# ---------------------------------------------------------------------------

# was: ctrl+shift+f11 = toggle_fullscreen
map cmd+enter toggle_fullscreen

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# was: cmd+, = edit_config_file (we prefer live reload — edit files manually)
map cmd+, load_config_file
# iTerm2 cmd+r clears the buffer; we deliberately leave this to the shell.
# Ctrl+L still works for clear-screen.
map cmd+r no_op
# was: cmd+q = quit
map cmd+q quit
