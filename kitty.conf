# kitty main config
#
# Keybindings live in iterm2-keys.conf so the override set is in one place.
# To revert to kitty defaults: comment out the `include` line below.
#
# See https://sw.kovidgoyal.net/kitty/conf/ for the full default reference.

include iterm2-keys.conf

# Auto-switch between light/dark theme based on macOS system appearance.
# pick-theme.sh emits an `include theme-{light,dark}.conf` line based on the
# current macOS appearance. After toggling appearance, reload kitty (cmd+,)
# for it to take effect.
geninclude ~/.config/kitty/pick-theme.sh

# --- General behaviour tweaks to feel more like iTerm2 ---

# macOS: use Option as Alt so Option+key sends escape sequences (iTerm2 default behaviour)
macos_option_as_alt yes

# Confirm before closing a window/quitting when a program is still running
# (prevents an accidental cmd+q from silently killing Claude sessions).
# -1 = prompt when there are running programs beyond the shell.
confirm_os_window_close -1

# Scrollback closer to iTerm2's generous default
scrollback_lines 10000

# Copy on select (iTerm2 default)
copy_on_select yes

# Cursor: iTerm2 uses a blinking block by default
cursor_shape block
cursor_blink_interval 0.5

# Window padding for a bit of breathing room
window_padding_width 4

# Tab bar style closer to iTerm2's look
tab_bar_style powerline
tab_powerline_style slanted

# Use the splits layout so cmd+d / cmd+shift+d can place windows
# side-by-side vs stacked (the vsplit/hsplit location hints only
# work under the splits layout).
enabled_layouts splits,stack

# Bell: visual only, no audio (iTerm2-ish)
enable_audio_bell no
visual_bell_duration 0.1

# Remote control: lets random-theme.sh (called from .zshrc) recolor each new
# window with a random pastel theme from ~/.config/kitty/themes/
allow_remote_control yes

# When macOS switches light/dark mode, instantly re-roll every window with a
# random theme from the matching pool (event-driven, no polling).
watcher theme-watcher.py

# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME